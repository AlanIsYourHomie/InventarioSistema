name: Pruebas PHPUnit

on:
  push:
    branches: [ Desarrollo ]
  pull_request:
    branches: [ Desarrollo ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tottusbd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Instalar dependencias con Composer
        run: composer install --no-interaction --prefer-dist

      - name: Ejecutar pruebas PHPUnit
        run: vendor/bin/phpunit --display-notices
