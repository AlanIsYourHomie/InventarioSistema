name: Pruebas PHPUnit

on:
  push:
    branches: [ Desarrollo ]
  pull_request:
    branches: [ Desarrollo ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Instalar dependencias con Composer
        run: composer install --no-interaction --prefer-dist

      - name: PHPUnit
        run: phpunit --configuration phpunit.xml
